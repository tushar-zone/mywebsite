<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tushar Zone — Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      background: #080808; color: #f5c542;
      font-family: Arial, sans-serif;
    }
    main { max-width: 700px; margin: 25px auto; }
    section, .post {
      background: #151515; border: 1px solid #444;
      border-radius: 12px; padding: 18px; margin: 16px 0;
    }
    input, textarea {
      width: 100%; padding: 12px; margin: 8px 0;
      background: #222; color: white;
      border: 1px solid #555; border-radius: 7px;
      font: inherit;
    }
    textarea { min-height: 160px; resize: vertical; }
    button {
      padding: 11px 15px; margin: 5px 4px 5px 0;
      border: 0; border-radius: 7px;
      background: #f5c542; color: #111;
      font-weight: bold; cursor: pointer;
    }
    .danger { background: #ff7777; }
    .muted { color: #ccc; overflow-wrap: anywhere; }
    .post h3 { color: #f5c542; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>Tushar Zone</h1>
  <h2>Admin Panel</h2>

  <section>
    <p id="status" class="muted">লগইন করা হয়নি।</p>
    <button id="login">Google দিয়ে Login</button>
    <button id="logout" hidden>Logout</button>
  </section>

  <section id="editor" hidden>
    <h2 id="formTitle">নতুন লেখা যোগ করো</h2>
    <form id="postForm">
      <input id="title" placeholder="লেখার শিরোনাম" required maxlength="200">
      <textarea id="content" placeholder="এখানে লেখা লিখো..." required></textarea>
      <button id="saveButton" type="submit">লেখা প্রকাশ করো</button>
      <button id="cancelEdit" type="button" hidden>বাতিল</button>
    </form>
  </section>

  <section>
    <h2>প্রকাশিত লেখা</h2>
    <div id="posts" class="muted">লেখা লোড হচ্ছে...</div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBZu_ChHBpAmJ15l-22LdahOAPntIenxO0",
  authDomain: "tushar-zone-558ed.firebaseapp.com",
  projectId: "tushar-zone-558ed",
  storageBucket: "tushar-zone-558ed.firebasestorage.app",
  messagingSenderId: "886961280145",
  appId: "1:886961280145:web:40269c604abe491c7d1b30",
  measurementId: "G-8S6YC6ZBM1"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// এই UID অবশ্যই তোমার Firebase Authentication UID হতে হবে।
const ADMIN_UID = "ytrhPSorvPa44Umkqn5ANi3GHZB3";

const status = document.getElementById("status");
const loginButton = document.getElementById("login");
const logoutButton = document.getElementById("logout");
const editor = document.getElementById("editor");
const form = document.getElementById("postForm");
const titleInput = document.getElementById("title");
const contentInput = document.getElementById("content");
const postsBox = document.getElementById("posts");
const saveButton = document.getElementById("saveButton");
const cancelButton = document.getElementById("cancelEdit");

let editingId = null;
let unsubscribePosts = null;

loginButton.onclick = async () => {
  try {
    await auth.signInWithPopup(
      new firebase.auth.GoogleAuthProvider()
    );
  } catch (error) {
    status.textContent = "লগইন সমস্যা: " + error.message;
  }
};

logoutButton.onclick = () => auth.signOut();

function resetForm() {
  editingId = null;
  form.reset();
  document.getElementById("formTitle").textContent = "নতুন লেখা যোগ করো";
  saveButton.textContent = "লেখা প্রকাশ করো";
  cancelButton.hidden = true;
}

cancelButton.onclick = resetForm;

function showPosts() {
  if (unsubscribePosts) unsubscribePosts();

  postsBox.textContent = "লেখা লোড হচ্ছে...";

  unsubscribePosts = db.collection("posts")
    .onSnapshot(snapshot => {
      postsBox.replaceChildren();

      if (snapshot.empty) {
        postsBox.textContent = "এখনও কোনো লেখা নেই।";
        return;
      }

      snapshot.forEach(doc => {
        const data = doc.data();
        const article = document.createElement("article");
        article.className = "post";

        const heading = document.createElement("h3");
        heading.textContent = data.title || "শিরোনাম নেই";

        const paragraph = document.createElement("p");
        paragraph.className = "muted";
        paragraph.style.whiteSpace = "pre-wrap";
        paragraph.textContent = data.content || "";

        article.append(heading, paragraph);

        if (auth.currentUser && auth.currentUser.uid === ADMIN_UID) {
          const editButton = document.createElement("button");
          editButton.textContent = "সম্পাদনা";

          editButton.onclick = () => {
            editingId = doc.id;
            titleInput.value = data.title || "";
            contentInput.value = data.content || "";
            document.getElementById("formTitle").textContent = "লেখা সম্পাদনা";
            saveButton.textContent = "পরিবর্তন সেভ করো";
            cancelButton.hidden = false;
            editor.scrollIntoView({ behavior: "smooth" });
          };

          const deleteButton = document.createElement("button");
          deleteButton.textContent = "মুছে ফেলো";
          deleteButton.className = "danger";

          deleteButton.onclick = async () => {
            if (!confirm("এই লেখাটি মুছে ফেলতে চাও?")) return;
            try {
              await db.collection("posts").doc(doc.id).delete();
            } catch (error) {
              alert("মুছতে সমস্যা হয়েছে: " + error.message);
            }
          };

          article.append(editButton, deleteButton);
        }

        postsBox.append(article);
      });
    }, error => {
      postsBox.textContent = "লেখা লোড হয়নি: " + error.message;
    });
}

form.onsubmit = async event => {
  event.preventDefault();

  const user = auth.currentUser;
  if (!user || user.uid !== ADMIN_UID) {
    status.textContent = "এই কাজের অনুমতি নেই।";
    return;
  }

  const title = titleInput.value.trim();
  const content = contentInput.value.trim();
  if (!title || !content) return;

  saveButton.disabled = true;

  try {
    if (editingId) {
      await db.collection("posts").doc(editingId).update({
        title, content,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    } else {
      await db.collection("posts").add({
        title, content,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    resetForm();
    status.textContent = "লেখা সফলভাবে সেভ হয়েছে।";
  } catch (error) {
    status.textContent = "সেভ করতে সমস্যা: " + error.message;
  } finally {
    saveButton.disabled = false;
  }
};

auth.onAuthStateChanged(user => {
  if (unsubscribePosts) {
    unsubscribePosts();
    unsubscribePosts = null;
  }

  loginButton.hidden = !!user;
  logoutButton.hidden = !user;
  editor.hidden = !user || user.uid !== ADMIN_UID;

  if (!user) {
    status.textContent = "লগইন করে লেখা দেখতে পারো।";
    postsBox.textContent = "লেখা লোড হচ্ছে...";
    return;
  }

  if (user.uid !== ADMIN_UID) {
    status.textContent = "লগইন হয়েছে, কিন্তু এই অ্যাকাউন্ট Admin নয়।";
  } else {
    status.textContent = "Admin হিসেবে লগইন হয়েছে: " + (user.email || "");
  }

  showPosts();
});
</script>
</body>
</html>
